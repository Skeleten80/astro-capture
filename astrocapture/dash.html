<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstroCapture Dashboard</title>
<style>
  :root {
    --bg: #0b0e14;
    --bg-grad: radial-gradient(1200px 600px at 50% -10%, #141a28 0%, #0b0e14 60%);
    --card: rgba(255, 255, 255, 0.045);
    --card-border: rgba(255, 255, 255, 0.09);
    --text: #e9ebf2;
    --muted: #9aa1b5;
    --faint: #6b7186;
    --accent: #8fb0ff;
    --green: #8fd6a0;
    --amber: #e6c07a;
    --red: #e08f8f;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-grad), var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
                 Inter, Helvetica, Arial, sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 22px;
    background: rgba(11, 14, 20, 0.55);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    backdrop-filter: blur(18px) saturate(1.3);
    border-bottom: 1px solid var(--card-border);
  }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: 0.2px; }
  header h1 .sub { color: var(--faint); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 12px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--card-border);
    font-size: 12.5px; font-weight: 500; text-transform: capitalize;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .pill.running .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .pill.paused .dot  { background: var(--amber);  box-shadow: 0 0 8px var(--amber); }
  .pill.done .dot    { background: var(--green);  box-shadow: 0 0 8px var(--green); }
  .pill.aborted .dot, .pill.error .dot { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .spacer { flex: 1; }
  main {
    max-width: 1180px; margin: 0 auto; padding: 20px 22px 40px;
    display: grid; gap: 16px;
    grid-template-columns: repeat(12, 1fr);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 16px 18px;
    -webkit-backdrop-filter: blur(18px) saturate(1.25);
    backdrop-filter: blur(18px) saturate(1.25);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .card h2 {
    margin: 0 0 12px; font-size: 11.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted);
  }
  .span4 { grid-column: span 4; } .span6 { grid-column: span 6; }
  .span8 { grid-column: span 8; } .span12 { grid-column: span 12; }
  @media (max-width: 900px) {
    .span4, .span6, .span8 { grid-column: span 12; }
  }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; align-items: baseline; }
  .kv dt { color: var(--faint); font-size: 12.5px; }
  .kv dd { margin: 0; font-family: var(--mono); font-size: 13px; text-align: right; }
  .kv dd .unit { color: var(--faint); font-size: 11px; }
  .big { font-size: 20px; font-weight: 600; letter-spacing: 0.3px; }
  .state-chip {
    font-family: var(--mono); font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--accent);
  }
  .bar-track {
    height: 8px; border-radius: 999px; overflow: hidden;
    background: rgba(255,255,255,0.08); margin: 10px 0 6px;
  }
  #progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #6d8fd6, var(--accent));
    border-radius: 999px; transition: width 0.6s ease;
  }
  #progress-label { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  #step-list { margin: 12px 0 0; padding: 0; list-style: none; }
  #step-list li {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 4px; border-top: 1px solid rgba(255,255,255,0.06);
    font-family: var(--mono); font-size: 12.5px;
  }
  #step-list li:first-child { border-top: none; }
  .badge {
    min-width: 52px; text-align: center; padding: 2px 8px; border-radius: 6px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px;
    background: rgba(143,176,255,0.14); color: var(--accent);
    border: 1px solid rgba(143,176,255,0.25);
  }
  .badge.dark  { background: rgba(154,161,181,0.12); color: var(--muted); border-color: rgba(154,161,181,0.25); }
  .badge.flat  { background: rgba(230,192,122,0.12); color: var(--amber); border-color: rgba(230,192,122,0.25); }
  .badge.bias  { background: rgba(143,214,160,0.12); color: var(--green); border-color: rgba(143,214,160,0.25); }
  #step-list .counts { margin-left: auto; color: var(--muted); }
  #step-list li.active { color: var(--text); }
  #step-list li.active .counts { color: var(--accent); }
  #thumbnail { width: 100%; border-radius: 12px; display: block; background: #000; }
  #live-stack { width: 100%; border-radius: 12px; display: block; background: #000; }
  #live-caption { color: var(--muted); font-size: 0.85em; margin-top: 6px; }
  #thumb-caption { margin-top: 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  #log {
    font-family: var(--mono); font-size: 12px; line-height: 1.55;
    height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
    background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px; padding: 12px 14px; color: #c9cede;
  }
  #log .t { color: var(--faint); }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    appearance: none; border: 1px solid var(--card-border); border-radius: 12px;
    padding: 9px 18px; font-size: 13.5px; font-weight: 500; color: var(--text);
    background: rgba(255,255,255,0.07); cursor: pointer;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    transition: background 0.15s ease, transform 0.05s ease;
  }
  button:hover:not(:disabled) { background: rgba(255,255,255,0.12); }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { opacity: 0.35; cursor: default; }
  #btn-abort { color: #f0b0b0; border-color: rgba(224,143,143,0.35); background: rgba(224,143,143,0.08); }
  #btn-abort:hover:not(:disabled) { background: rgba(224,143,143,0.16); }
</style>
</head>
<body>
<header>
  <h1>AstroCapture<span class="sub">live session</span></h1>
  <span id="session-name" style="color:var(--muted);font-size:13px;font-family:var(--mono)"></span>
  <span class="pill" id="status-pill"><span class="dot"></span><span id="status-text">idle</span></span>
  <div class="spacer"></div>
  <div class="controls">
    <button id="btn-pause" type="button">Pause</button>
    <button id="btn-resume" type="button">Resume</button>
    <button id="btn-abort" type="button">Abort</button>
  </div>
</header>

<main>
  <section class="card span4">
    <h2>Target</h2>
    <dl class="kv">
      <dt>Name</dt><dd class="big" id="target-name" style="font-family:inherit">—</dd>
      <dt>RA</dt><dd><span id="target-ra">—</span> <span class="unit">h</span></dd>
      <dt>Dec</dt><dd><span id="target-dec">—</span> <span class="unit">°</span></dd>
      <dt>Type</dt><dd id="target-type">—</dd>
      <dt>Mag</dt><dd id="target-mag">—</dd>
    </dl>
  </section>

  <section class="card span4">
    <h2>Mount</h2>
    <dl class="kv">
      <dt>State</dt><dd><span class="state-chip" id="mount-state">—</span></dd>
      <dt>RA</dt><dd><span id="mount-ra">—</span> <span class="unit">h</span></dd>
      <dt>Dec</dt><dd><span id="mount-dec">—</span> <span class="unit">°</span></dd>
    </dl>
  </section>

  <section class="card span4">
    <h2>Camera</h2>
    <dl class="kv">
      <dt>State</dt><dd><span class="state-chip" id="cam-state">—</span></dd>
      <dt>Exposure</dt><dd id="cam-exposure">—</dd>
      <dt>Sensor</dt><dd><span id="cam-temp">—</span></dd>
    </dl>
  </section>

  <section class="card span8">
    <h2>Session progress</h2>
    <div id="progress-bar" class="bar-track"><div id="progress-fill"></div></div>
    <div id="progress-label">—</div>
    <ul id="step-list"></ul>
  </section>

  <section class="card span4">
    <h2>Latest frame</h2>
    <img id="thumbnail" alt="Latest captured frame" src="">
    <div id="thumb-caption">waiting for first frame…</div>
  </section>

  <section class="card span4">
    <h2>Live stack (EAA)</h2>
    <img id="live-stack" alt="Live stacked image" src="">
    <div id="live-caption">waiting for first light frame…</div>
  </section>

  <section class="card span12">
    <h2>Session log</h2>
    <div id="log"></div>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

function fmtHMS(s) {
  s = Math.max(0, Math.round(s));
  const h = String(Math.floor(s / 3600)).padStart(2, "0");
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
  const sec = String(s % 60).padStart(2, "0");
  return h + ":" + m + ":" + sec;
}

function setStatus(status) {
  const pill = $("status-pill"), txt = $("status-text");
  txt.textContent = status;
  pill.className = "pill";
  if (["slewing", "exposing", "dithering"].includes(status)) pill.classList.add("running");
  else if (status === "paused") pill.classList.add("paused");
  else if (status === "done") pill.classList.add("done");
  else if (status === "aborted" || status === "error") pill.classList.add("aborted");
  const terminal = ["done", "aborted", "error"].includes(status);
  $("btn-pause").disabled = terminal || status === "paused";
  $("btn-resume").disabled = terminal || status !== "paused";
  $("btn-abort").disabled = terminal;
}

function update(state) {
  setStatus(state.session.status);
  $("session-name").textContent = state.session.name;
  document.title = "AstroCapture — " + state.session.name + " (" + state.session.status + ")";

  const t = state.target;
  $("target-name").textContent = t.name;
  $("target-ra").textContent = t.ra_hours.toFixed(4);
  $("target-dec").textContent = (t.dec_deg >= 0 ? "+" : "") + t.dec_deg.toFixed(4);
  $("target-type").textContent = t.type || "—";
  $("target-mag").textContent = (t.mag === null || t.mag === undefined) ? "—" : String(t.mag);

  const m = state.mount;
  $("mount-state").textContent = m.state;
  $("mount-ra").textContent = m.ra_hours === null ? "—" : m.ra_hours.toFixed(4);
  $("mount-dec").textContent = m.dec_deg === null ? "—"
    : (m.dec_deg >= 0 ? "+" : "") + m.dec_deg.toFixed(4);

  const c = state.camera;
  $("cam-state").textContent = c.state;
  const le = c.last_exposure;
  $("cam-exposure").textContent =
    (le.exposure_s === null || le.exposure_s === undefined ? "—" : le.exposure_s + " s") +
    (c.in_progress_s !== null && c.in_progress_s !== undefined ? "  (" + c.in_progress_s.toFixed(1) + " s in)" : "");
  $("cam-temp").textContent =
    (c.temperature_c === null || c.temperature_c === undefined ? "—" : c.temperature_c.toFixed(1) + " °C");

  const p = state.plan;
  const pct = p.frames_total ? (100 * p.frames_taken / p.frames_total) : 0;
  $("progress-fill").style.width = pct.toFixed(1) + "%";
  let label = p.frames_taken + " / " + p.frames_total + " frames";
  if (p.current_step) {
    const cs = p.current_step;
    label += "  ·  " + cs.type + " " + cs.frame + "/" + cs.count +
             (cs.filter ? " (" + cs.filter + ")" : "") + " " + cs.exposure_s + "s";
  }
  label += "  ·  elapsed " + fmtHMS(p.elapsed_s) + "  ·  ETA " + fmtHMS(p.eta_s);
  $("progress-label").textContent = label;

  const ul = $("step-list");
  ul.innerHTML = "";
  const cur = p.current_step ? p.current_step.index : -1;
  for (const s of p.steps) {
    const li = document.createElement("li");
    if (s.index === cur) li.className = "active";
    const badge = document.createElement("span");
    badge.className = "badge " + (s.type === "light" ? "" : s.type);
    badge.textContent = s.type;
    const desc = document.createElement("span");
    desc.textContent = s.count + "× " + s.exposure_s + "s" + (s.filter ? "  " + s.filter : "");
    const counts = document.createElement("span");
    counts.className = "counts";
    counts.textContent = s.done + " / " + s.count;
    li.append(badge, desc, counts);
    ul.append(li);
  }

  $("thumb-caption").textContent = state.latest_frame || "waiting for first frame…";
  updateLiveCaption(state);
}

async function refreshState() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    if (!r.ok) return;
    update(await r.json());
  } catch (e) { /* session page keeps last known state */ }
}

// Thumbnail refresh (cache-busted). 404s before the first frame are normal.
function refreshThumb() {
  const img = $("thumbnail");
  img.src = "/api/thumbnail?t=" + Date.now();
}
$("thumbnail").addEventListener("error", () => { $("thumbnail").removeAttribute("src"); });

// Live EAA stack: the caption rides along with /api/state (updated in
// updateLiveCaption below); the image itself refreshes on its own timer.
function refreshLiveImg() {
  const img = $("live-stack");
  img.src = "/api/live.png?t=" + Date.now();
}
$("live-stack").addEventListener("error", () => { $("live-stack").removeAttribute("src"); });
setInterval(refreshLiveImg, 5000);

function updateLiveCaption(state) {
  const live = state && state.live;
  if (live && live.frames > 0) {
    const snr = (live.snr_db === null || live.snr_db === undefined) ? "—" : live.snr_db.toFixed(1) + " dB";
    $("live-caption").textContent =
      live.frames + " frames · SNR " + snr +
      " · shift (" + live.last_shift_px[0] + ", " + live.last_shift_px[1] + ") px";
  } else {
    $("live-caption").textContent = "waiting for first light frame…";
  }
}

// Session log via SSE, with sticky auto-scroll.
const logEl = $("log");
let stick = true;
logEl.addEventListener("scroll", () => {
  stick = (logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight) < 40;
});
function appendLog(line) {
  const wasStick = stick;
  const div = document.createElement("div");
  const m = line.match(/^(\S+ \S+)\s+(\S+)\s+(.*)$/);
  if (m) {
    const t = document.createElement("span"); t.className = "t"; t.textContent = m[1] + " " + m[2] + " ";
    div.append(t, document.createTextNode(m[3]));
  } else {
    div.textContent = line;
  }
  logEl.append(div);
  while (logEl.children.length > 2000) logEl.removeChild(logEl.firstChild);
  if (wasStick) logEl.scrollTop = logEl.scrollHeight;
}
const es = new EventSource("/api/log");
es.onmessage = (e) => appendLog(e.data);
es.onerror = () => { /* EventSource retries on its own */ };

async function post(path) {
  const r = await fetch(path, {method: "POST"});
  const body = await r.json();
  if (!body.ok) throw new Error(body.error || ("HTTP " + r.status));
  return body;
}
$("btn-pause").addEventListener("click", async () => {
  try { await post("/api/pause"); refreshState(); }
  catch (e) { alert("Pause failed: " + e.message); }
});
$("btn-resume").addEventListener("click", async () => {
  try { await post("/api/resume"); refreshState(); }
  catch (e) { alert("Resume failed: " + e.message); }
});
$("btn-abort").addEventListener("click", async () => {
  if (!confirm("Abort the running session? Captured frames are kept.")) return;
  try { await post("/api/abort"); refreshState(); }
  catch (e) { alert("Abort failed: " + e.message); }
});

refreshState();
refreshThumb();
refreshLiveImg();
setInterval(refreshState, 2000);
setInterval(refreshThumb, 4000);
</script>
</body>
</html>
